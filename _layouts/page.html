---
layout: default
---
<article class="page-content">
  <div class="container">
    {% if page.title %}
    <header class="page-header">
      <h1>{{ page.title }}</h1>
      {% if page.excerpt %}<p class="page-excerpt">{{ page.excerpt }}</p>{% endif %}
    </header>
    {% endif %}
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
