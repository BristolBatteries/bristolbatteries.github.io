# =============================================================================
# Site Configuration
# Bristol Energy Systems – University of Bristol
# =============================================================================

title:       "Bristol Energy Systems"
description: "Research in battery systems, solar energy, and energy access at the University of Bristol, EEME Department."
url:         "https://bristolbatteries.github.io"
baseurl:     ""

github_username: BristolBatteries

# =============================================================================
# Research Themes
# To add a new theme:
#   1. Add an entry here
#   2. Create _pages/research/<id>.md with layout: theme and theme_id: <id>
#   3. Tag people, projects, and publications with the theme id
# =============================================================================
research_themes:
  - id:          batteries
    name:        Batteries
    color:       "#2563eb"
    icon:        "⚡"
    url:         /research/batteries/
    description: >
      Modelling, characterisation, and management of lithium-ion and
      next-generation battery systems.

  - id:          solar
    name:        Solar
    color:       "#d97706"
    icon:        "☀️"
    url:         /research/solar/
    description: >
      Photovoltaic systems, solar energy conversion, and grid integration.

  - id:          energy-access
    name:        Energy Access
    color:       "#059669"
    icon:        "🌍"
    url:         /research/energy-access/
    description: >
      Sustainable energy solutions for communities without reliable electricity access.

# =============================================================================
# Collections
# =============================================================================
collections:
  people:
    output: true
    permalink: /people/:name/
  projects:
    output: true
    permalink: /projects/:name/

include:
  - _pages

# =============================================================================
# Defaults
# =============================================================================
defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page
  - scope:
      path: "_people"
      type: people
    values:
      layout: person
  - scope:
      path: "_projects"
      type: projects
    values:
      layout: project

# =============================================================================
# Build Settings
# =============================================================================
markdown:  kramdown
permalink: /:categories/:title/

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Exclude editor backup files
exclude:
  - "*.~undo-tree~"
  - ".*.~undo-tree~"
  - Gemfile.lock
  - vendor/
